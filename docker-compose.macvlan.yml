# Override de rede para o deploy no HUB (macvlan).
#
# A infra cria/fornece uma macvlan e um IP para o container. Com macvlan o
# nginx ganha um IP próprio na rede do HUB, então NÃO precisa mapear as portas
# 80/443 do host (elas ficam livres, como a infra pediu).
#
# Uso (combinando com o compose base):
#   docker compose -f docker-compose.yml -f docker-compose.macvlan.yml up -d --build
#
# >>> PREENCHA os 4 valores marcados com <-- que a infra te passar. <<<
#
# Observação: por padrão o próprio host Docker não consegue "pingar" um
# container macvlan — isso é normal e não afeta o acesso dos usuários pela rede.

services:
  nginx:
    # Com IP próprio (macvlan) não se mapeia porta do host: reset remove o
    # "80:80/443:443" herdado do compose base para evitar conflito no host.
    ports: !reset []
    networks:
      hub_macvlan:
        ipv4_address: 10.0.0.50   # <-- IP do container fornecido pela infra
      # Mantém o nginx também na bridge interna para alcançar o serviço "web".
      default: {}

networks:
  hub_macvlan:
    driver: macvlan
    driver_opts:
      parent: eth0                # <-- interface de rede pai no host (ex.: eth0, ens160)
    ipam:
      config:
        - subnet: 10.0.0.0/24     # <-- sub-rede da rede do HUB
          gateway: 10.0.0.1       # <-- gateway da rede do HUB

# --- Alternativa: se a INFRA já criou a rede macvlan por conta própria ---
# Em vez do bloco "networks" acima, referencie a rede existente como external:
#
# networks:
#   hub_macvlan:
#     external: true
#     name: NOME_DA_REDE_QUE_A_INFRA_CRIOU
#
# (nesse caso remova o driver/driver_opts/ipam daqui)
