services:
  web:
    build: .
    working_dir: /app/elo
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn elo.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECURE_SSL: "True"
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elo.rule=Host(`elo.hub.local`)"   # <-- confirmar com a infra
      - "traefik.http.routers.elo.entrypoints=websecure"
      - "traefik.http.routers.elo.tls=true"
      - "traefik.http.services.elo.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-network"

networks:
  traefik-network:
    external: true
    name: NOME_DA_REDE_DO_TRAEFIK   # <-- confirmar com quem administra
