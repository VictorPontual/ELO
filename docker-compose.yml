services:
  web:
    build: .
    working_dir: /app/elo
    # Forma de lista: o Compose passa os argumentos direto, sem tentar quebrar
    # a string em palavras (a forma "sh -c ..." em string quebra o parser de
    # algumas versões do Compose).
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn elo.wsgi:application \
          --bind 0.0.0.0:8000 --workers 3 --timeout 120 \
          --access-logfile - --error-logfile - \
          --log-level "$${GUNICORN_LOG_LEVEL:-info}" \
          --capture-output --forwarded-allow-ips '*'
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECURE_SSL: "True"
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elo.rule=Host(`elo.hub-unb.ebserh`)"
      - "traefik.http.routers.elo.entrypoints=websecure"
      - "traefik.http.routers.elo.tls=true"
      - "traefik.http.services.elo.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.nexterm.middlewares=public-chain@file"

networks:
  traefik-network:
    external: true
    name: traefik_proxy